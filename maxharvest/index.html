<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f7a3a">
<title>Max Harvest</title>
<meta name="description" content="Max Harvest – dein Holzfäller-Imperium: Traktoren mit Kreissägen fällen Bäume, das Sägewerk macht Bretter, der LKW bringt Geld. 12 Wälder, viele Upgrades!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪵%3C/text%3E%3C/svg%3E">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }
</script>
<style>
:root{--ink:#2b1c10;--cream:#fff4dc;--butter:#ffd449;--leaf:#3dbb5b;--leafd:#2a8a42;--red:#ff5a4a;--wood:#a8693a;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --font:ui-rounded,"Arial Rounded MT Bold","Varela Round","Trebuchet MS",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#9ad8ff;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#floats{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.fl{position:absolute;left:0;top:0;font-weight:900;font-size:20px;color:#ffe45c;white-space:nowrap;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.fl.g{color:#ffd449;font-size:26px}.fl.w{color:#fff;font-size:16px}.fl.b{color:#8de1ff}
.hide{display:none!important}
.st{pointer-events:auto;min-width:44px;min-height:44px;border:3px solid var(--ink);border-radius:16px;background:var(--cream);color:var(--ink);font:800 16px/1 var(--font);padding:0 12px;cursor:pointer;position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;white-space:nowrap}
.st:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.st:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
.st.go{background:var(--leaf);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.st.warm{background:var(--butter)}
.st.red{background:var(--red);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.st.big{min-height:56px;font-size:20px;padding:0 20px;border-radius:20px}
.st.off{opacity:.55}
.st small{font-size:12px;opacity:.8}
.dot{position:absolute;right:-6px;top:-8px;width:18px;height:18px;border-radius:50%;background:var(--red);border:3px solid var(--ink)}
.pill{pointer-events:auto;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);min-height:44px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px}
.pill small{font-size:12px;font-weight:800;color:#5a7a2a}
.hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.hud>*{position:absolute;pointer-events:auto}
.tl{left:calc(var(--safe-l) + 10px);top:calc(var(--safe-t) + 8px);display:flex;gap:8px;align-items:center}
.tc{left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 8px);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none!important}
.tc>*{pointer-events:auto}
.tr{right:calc(var(--safe-r) + 10px);top:calc(var(--safe-t) + 8px);display:flex;gap:8px}
.bl{left:calc(var(--safe-l) + 10px);bottom:calc(var(--safe-b) + 10px);display:flex;gap:10px}
.br{right:calc(var(--safe-r) + 10px);bottom:calc(var(--safe-b) + 10px);display:flex;gap:10px;align-items:flex-end}
.chips{display:flex;gap:6px;flex-wrap:nowrap}
.chip{background:rgba(255,244,220,.92);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;font-weight:800;font-size:13px;white-space:nowrap}
#lvlPill{min-height:34px;font-size:15px;padding:0 12px;border-radius:14px}
#boostBar{position:absolute;left:0;bottom:0;height:5px;background:#ffd449;width:0;border-radius:0 0 12px 12px}
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 14px)}
#menu{justify-content:space-between;pointer-events:none}
#menu>*{pointer-events:auto}
#menu .top{display:flex;flex-direction:column;align-items:center;padding-top:6vh;pointer-events:none}
#menu h1{font-size:min(13vw,92px);line-height:.92;text-align:center;color:#fff;letter-spacing:-1px;font-style:italic;
  text-shadow:0 6px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);transform:rotate(-3deg);animation:bob 2.4s ease-in-out infinite}
#menu h1 em{font-style:inherit;color:var(--butter)}
#menu .tag{margin-top:14px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink);font-size:clamp(14px,2.6vw,20px);text-align:center}
#menu .bottom{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(86vw,340px)}
#menu .bottom .st{width:100%}
#menu .sub{font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink);font-size:14px;text-align:center}
@keyframes bob{50%{transform:rotate(-3deg) translateY(-8px)}}
.modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(25,16,8,.62);padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 12px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 12px)}
.panel{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);overflow:hidden;animation:up .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes up{from{transform:translateY(30px) scale(.94);opacity:0}}
.ph{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--leafd);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);flex:none}
.ph h3{font-size:22px;flex:1}
.ph .bal{background:var(--cream);color:var(--ink);text-shadow:none;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:900;font-size:18px}
.bar2{display:flex;align-items:center;gap:6px;flex:none;padding:8px 10px 2px}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding-bottom:4px}
.tabs .st{min-height:34px;font-size:13px;padding:0 9px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.tabs .st.on{background:var(--butter)}
.list{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:8px 10px 12px;display:flex;flex-direction:column;gap:8px;position:relative;flex:1;min-height:0}
.list h4{font-size:16px;margin:6px 2px 0;color:var(--leafd)}
.up{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px}
.up .ui{font-size:28px;width:46px;height:46px;border-radius:12px;background:#ffe9b0;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.up .um{min-width:0}.up .um b{font-size:16px;display:block}.up .um small{font-size:12px;color:#7a5a3a;font-weight:700;display:block}
.up .bar{height:8px;border-radius:5px;background:#e8dcc0;margin:4px 0 3px;overflow:hidden;border:1.5px solid var(--ink)}
.up .bar i{display:block;height:100%;background:var(--leaf);width:0}
.up .ue{font-size:13px;font-weight:800}
.up .buy{min-width:98px;min-height:46px;flex-direction:column;gap:2px;font-size:15px}
.up .buy.no{opacity:.5;background:#e9dcc0}
.up .buy.max{background:var(--butter)}
.mult{display:flex;gap:5px;flex:none;align-items:center;padding-bottom:4px}
.mult .st{min-height:34px;min-width:0;font-size:13px;padding:0 8px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.mult .st.on{background:var(--butter)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fc{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.fc .sw{height:64px;display:flex;align-items:center;justify-content:center;font-size:36px;border-bottom:3px solid var(--ink)}
.fc .fi{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.fc b{font-size:16px}.fc small{font-size:12px;font-weight:700;color:#7a5a3a}
.fc .st{margin-top:auto;min-height:38px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.fc.cur{outline:4px solid var(--butter)}
.fc.lock{opacity:.6}
.card{width:min(440px,100%);background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:18px 18px 18px;text-align:center;box-shadow:0 7px 0 var(--ink);animation:up .45s cubic-bezier(.2,1.3,.4,1) both;max-height:100%;overflow:auto}
.card h3{font-size:26px;margin-bottom:6px}.card p{font-weight:700;font-size:16px;line-height:1.4;margin:6px 0 12px}
.card .big-n{font-size:34px;font-weight:900;color:var(--leafd);margin:4px 0}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:#d9c9a3;border:2px solid var(--ink)}.dots i.on{background:var(--butter)}
#rotate{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 60px);z-index:25;background:var(--butter);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:900;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 var(--ink);width:max-content;max-width:92vw}
#toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translate(-50%,20px);z-index:40;background:var(--ink);color:#fff;font-weight:800;padding:10px 16px;border-radius:14px;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){
  .tc{top:calc(var(--safe-t) + 60px)}
  .pill{font-size:17px}.tr{gap:6px}.tr .st{min-width:40px;padding:0 8px}
  #rotate{top:auto;bottom:calc(var(--safe-b) + 84px)}
  .bl .st,.br .st{padding:0 10px}.st.big{padding:0 14px}
}
@media (max-height:430px){
  .st{min-height:40px;font-size:14px;padding:0 10px}.st.big{min-height:48px;font-size:17px}
  .pill{min-height:38px;font-size:17px}.tl,.tr,.tc{top:calc(var(--safe-t) + 5px)}
  .bl,.br{bottom:calc(var(--safe-b) + 6px)}
  .panel{border-radius:18px}.ph h3{font-size:18px}.up .ui{width:38px;height:38px;font-size:22px}.up{grid-template-columns:38px 1fr auto;padding:6px 8px}
  #menu h1{font-size:min(11vw,64px)}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="floats"></div>

  <div id="hud" class="hud hide">
    <div class="tl">
      <a class="st" href="../" aria-label="Zurück zur Spielhalle">←</a>
      <div class="pill"><span>💰</span><b id="coinV">0</b><small id="rateV">+0/s</small></div>
    </div>
    <div class="tc">
      <div class="pill" id="lvlPill"><b id="lvlName">Sommerwiese</b> <small id="treeV"></small></div>
      <div class="chips"><span class="chip" id="chLogs">🪵 0</span><span class="chip" id="chPlank">📦 0</span><span class="chip" id="chTruck">🚚 bereit</span></div>
    </div>
    <div class="tr">
      <button class="st" id="btnForest" aria-label="Wälder">🗺️</button>
      <button class="st" id="btnSnd" aria-label="Geräusche">🔊</button>
      <button class="st" id="btnMus" aria-label="Musik">🎵</button>
      <button class="st" id="btnFs" aria-label="Vollbild">⛶</button>
    </div>
    <div class="bl">
      <button class="st" id="btnAuto">🤖 Auto</button>
      <button class="st warm" id="btnBoost">⚡ Turbo<div id="boostBar"></div></button>
    </div>
    <div class="br">
      <button class="st" id="btnSell">🚚 Verkaufen</button>
      <button class="st go big" id="btnShop">🛒 Laden<i class="dot hide" id="shopDot"></i></button>
    </div>
  </div>

  <div id="rotate" class="hide"><span>📱↻ Dreh dein Gerät quer für die beste Sicht!</span><button class="st" id="rotOk" style="min-height:32px;box-shadow:0 3px 0 var(--ink)">OK</button></div>

  <div id="menu" class="screen">
    <div class="top"><h1>MAX<br><em>HARVEST</em></h1><div class="tag">🪵 Baue dein Holzfäller-Imperium! 🚜</div></div>
    <div class="bottom">
      <div class="sub" id="menuSub"></div>
      <button class="st go big" id="btnPlay">SPIELEN ▶</button>
      <a class="st" href="../">← Spielhalle</a>
    </div>
  </div>

  <div id="shop" class="modal hide">
    <div class="panel">
      <div class="ph"><h3>🛒 Upgrade-Laden</h3><div class="bal">💰 <span id="shopBal">0</span></div><button class="st red" id="shopX" aria-label="Schließen">✕</button></div>
      <div class="bar2"><div class="tabs" id="shopTabs"></div>
      <div class="mult"><button class="st on" data-m="1">×1</button><button class="st" data-m="5">×5</button><button class="st" data-m="25">×25</button><button class="st" data-m="0">MAX</button></div></div>
      <div class="list" id="shopList"></div>
    </div>
  </div>

  <div id="forests" class="modal hide">
    <div class="panel">
      <div class="ph"><h3>🗺️ Wälder</h3><div class="bal">💰 <span id="forBal">0</span></div><button class="st red" id="forX" aria-label="Schließen">✕</button></div>
      <div class="list"><div class="fgrid" id="forGrid"></div></div>
    </div>
  </div>

  <div id="offline" class="modal hide"><div class="card"><h3>👋 Willkommen zurück!</h3><p id="offTxt"></p><div class="big-n" id="offAmt"></div><button class="st go big" id="offOk">Einsammeln</button></div></div>

  <div id="tut" class="modal hide"><div class="card"><div class="dots" id="tutDots"></div><h3 id="tutH"></h3><p id="tutP"></p><button class="st go big" id="tutNext">Weiter ▶</button></div></div>

  <div id="toast"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
const trim = s => s.indexOf('.') < 0 ? s : s.replace(/0+$/, '').replace(/\.$/, '');
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? trim(n.toFixed(1)) : String(Math.floor(n));
  let i = 0; while (n >= 1000 && i < SUF.length - 1) { n /= 1000; i++; }
  return trim(n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + SUF[i];
}
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* ================= save ================= */
const KEY = 'maxharvest.v1';
const defSave = () => ({ coins: 0, earned: 0, up: {}, tractors: 1, unlocked: 1, level: 0, sfx: true, music: true, seen: false, t: Date.now(), rate: 0, boostCd: 0, cuts: 0, inLogs: 0, inVal: 0, pl: 0, plVal: 0 });
let save = defSave();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(defSave(), s); save.up = save.up || {}; } catch (e) {}
const hadSave = save.earned > 0;
const persist = () => { save.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
setInterval(persist, 4000);
addEventListener('pagehide', persist);
const lvl = id => save.up[id] || 0;

/* ================= upgrades ================= */
const GROUPS = ['🚜 Traktoren', '🏭 Sägewerk', '🚚 Verkauf', '🌲 Wald'];
const UL = [
  { id: 'power', g: 0, ic: '🪚', n: 'Sägeblatt', d: 'Schnittkraft pro Sekunde', base: 12, gr: 1.55, max: 60, val: l => 8 * 1.24 ** l, fm: v => fmt(v) + '/s' },
  { id: 'fleet', g: 0, ic: '🚜', n: 'Neuer Traktor', d: 'Mehr Traktoren fällen mehr Bäume', base: 100, gr: 2.1, max: 9, val: l => l + 1, fm: v => v + ' von 10', special: true },
  { id: 'speed', g: 0, ic: '⚙️', n: 'Motor', d: 'Fahrtempo', base: 25, gr: 1.6, max: 24, val: l => 5 + 0.35 * l, fm: v => v.toFixed(1) + ' m/s' },
  { id: 'cargo', g: 0, ic: '🪵', n: 'Ladefläche', d: 'Stämme pro Fahrt', base: 18, gr: 1.5, max: 40, val: l => 6 + 3 * l, fm: v => v + ' Stämme' },
  { id: 'magnet', g: 0, ic: '🧲', n: 'Greifer', d: 'Aufnahme-Reichweite für Stämme', base: 30, gr: 1.7, max: 16, val: l => 2.4 + 0.35 * l, fm: v => v.toFixed(1) + ' m' },
  { id: 'blade', g: 0, ic: '⭕', n: 'Riesen-Klinge', d: 'Größere Klinge trifft mehrere Bäume', base: 60, gr: 1.9, max: 14, val: l => 1.1 + 0.17 * l, fm: v => 'Ø ' + (v * 2).toFixed(1) + ' m' },
  { id: 'saw', g: 1, ic: '🏭', n: 'Sägegatter', d: 'Stämme pro Sekunde verarbeiten', base: 40, gr: 1.5, max: 50, val: l => 0.9 * 1.22 ** l, fm: v => fmt(v) + '/s' },
  { id: 'store', g: 1, ic: '📦', n: 'Lagerhalle', d: 'Platz für Stämme und Bretter', base: 35, gr: 1.5, max: 30, val: l => Math.floor(30 * 1.25 ** l), fm: v => fmt(v) + ' Platz' },
  { id: 'yield', g: 1, ic: '🪓', n: 'Feinschnitt', d: 'Bretter pro Stamm', base: 80, gr: 1.6, max: 40, val: l => 2 + 0.2 * l, fm: v => v.toFixed(1) + ' Bretter' },
  { id: 'price', g: 2, ic: '💎', n: 'Händler-Vertrag', d: 'Verkaufspreis aller Bretter', base: 50, gr: 1.5, max: 60, val: l => 1.12 ** l, fm: v => '×' + fmt(v) },
  { id: 'truckCap', g: 2, ic: '🚚', n: 'LKW-Größe', d: 'Bretter pro Fahrt', base: 30, gr: 1.5, max: 40, val: l => Math.floor(12 * 1.25 ** l), fm: v => fmt(v) + ' Bretter' },
  { id: 'truckCd', g: 2, ic: '⏱️', n: 'LKW-Tempo', d: 'Kürzere Pausen & schnellere Fahrt', base: 45, gr: 1.7, max: 22, val: l => Math.max(1, 8 * 0.9 ** l), fm: v => v.toFixed(1) + ' s Pause' },
  { id: 'regrow', g: 3, ic: '🌱', n: 'Dünger', d: 'Bäume wachsen schneller nach', base: 40, gr: 1.6, max: 20, val: l => Math.max(1.5, 16 * 0.9 ** l), fm: v => v.toFixed(1) + ' s' },
  { id: 'gold', g: 3, ic: '✨', n: 'Goldene Bäume', d: 'Chance auf 10× wertvolle Bäume', base: 100, gr: 1.8, max: 20, val: l => 0.03 + 0.01 * l, fm: v => Math.round(v * 100) + '%' },
  { id: 'boost', g: 3, ic: '⚡', n: 'Turbo-Dauer', d: 'Wie lange der Turbo anhält', base: 150, gr: 1.8, max: 15, val: l => 15 + 2 * l, fm: v => v + ' s' },

  const bx2 = this.x + Math.sin(this.h) * d, bz2 = this.z + Math.cos(this.h) * d;
  this.cutting = false;
  for (const t of trees) {
    if (t.state !== 'grown') continue;
    if (Math.hypot(t.x - bx2, t.z - bz2) < S.blade + t.r + .1) {
      this.cutting = true; t.hp -= S.power * boost * dt; t.shake = 1;
      if (Math.random() < dt * 30) { emit(bx2 + (t.x - bx2) * .5, .8, bz2 + (t.z - bz2) * .5, 1, { col: [0xe8c58a, 0xffe9b0, 0xd9b377], spd: 3, up: 2.5, life: .5, size: .1, spread: .2 }); }
      if (Math.random() < dt * 8) AU.chop();
      if (t.hp <= 0) { felled(t, bx2, bz2); if (this.target === t) this.target = null; }
    }
  }
  // log pickup
  if (this.cargo + this.incoming < S.cap) {
    const px = this.x + Math.sin(this.h) * .4, pz = this.z + Math.cos(this.h) * .4;
    for (const l of logs) {
      if (l.state === 'fly' || l.age < .7 || this.cargo + this.incoming >= S.cap) continue;
      if (Math.hypot(l.x - px, l.z - pz) < S.magnet) { l.state = 'fly'; l.ft = 0; l.tr = this; l.fx = l.x; l.fy = l.y; l.fz = l.z; l.m.quaternion.identity(); l.m.rotation.set(Math.PI / 2, 0, 0); this.incoming++; if (l.claim) l.claim = null; }
    }
  }
  // unload
  const inDock = Math.hypot(this.x - DOCK.x, this.z - DOCK.z) < DOCK.r;
  if (this.cargo > 0 && (this.mode === 'unload' || (isSel && inDock && this.sp < 3))) {
    this.unT += dt * 9;
    while (this.unT >= 1) {
      this.unT -= 1;
      if (this.cargo <= 0 || save.inLogs + 1 > S.store) { this.unT = 0; break; }
      const avg = this.val / this.cargo; this.val -= avg; this.cargo--; save.inLogs++; save.inVal += avg; spawnFeed(this);
    }
    if (this.cargo <= 0) { this.val = 0; this.mode = 'idle'; this.thinkT = 0; }
  }
  // visuals
  const u = this.g.userData;
  this.g.position.set(this.x, 0, this.z); this.g.rotation.y = this.h;
  u.body.position.y = Math.sin(now * 16 + this.i) * .025 * clamp(this.sp / 4, 0, 1.5);
  u.body.rotation.z = Math.sin(now * 11 + this.i * 2) * .012 * clamp(this.sp / 4, 0, 1.5);
  for (const w of u.wheels) w.rotation.x += this.sp * dt / w.userData.R;
  u.saw.userData.spin.rotation.y += dt * (this.cutting ? 42 : 10);
  u.beacon.visible = Math.floor(now * 4 + this.i) % 2 === 0;
  const n = u.bedLogs.length, show = Math.ceil(this.cargo / Math.max(1, S.cap) * n - 1e-6);
  for (let i = 0; i < n; i++) u.bedLogs[i].visible = i < show;
  this.exT -= dt; if (this.exT < 0) { this.exT = .35 + rnd(.2); emit(this.x + Math.cos(this.h) * .5 + Math.sin(this.h) * .95, 3, this.z - Math.sin(this.h) * .5 + Math.cos(this.h) * .95, 1, { col: 0xbbbbbb, spd: .2, up: 1.6, g: -.3, life: 1, size: .22, grow: 2, spread: .05 }); }
};

/* ================= input ================= */
const keys = {}; const ptr = { down: false, goal: null };
function keyVec() {
  const x = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0), z = (keys.ArrowDown || keys.s || keys.S ? 1 : 0) - (keys.ArrowUp || keys.w || keys.W ? 1 : 0);
  if (!x && !z) return null; const l = Math.hypot(x, z); return { x: x / l, z: z / l };
}
addEventListener('keydown', e => {
  if (e.repeat) { keys[e.key] = true; return; }
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); activateBoost(); }
  else if (e.key === 'e' || e.key === 'E') callTruck();
  else if (e.key === 'u' || e.key === 'U' || e.key === 'b') toggleModal('shop');
  else if (e.key === 'm' || e.key === 'M') toggleModal('forests');
  else if (e.key === 'Escape') closeModals();
  else if (e.key === 'Tab') { e.preventDefault(); selectNext(); }
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2();
function groundPoint(cx, cy) {
  _ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); _ray.setFromCamera(_ndc, cam);
  const o = _ray.ray.origin, d = _ray.ray.direction; if (Math.abs(d.y) < 1e-4) return null; const t = -o.y / d.y; if (t < 0) return null;
  return { x: o.x + d.x * t, z: o.z + d.z * t };
}
function handlePtr(e, first) {
  const p = groundPoint(e.clientX, e.clientY); if (!p || !sel) return;
  if (first) {
    if (Math.hypot(p.x - PILE.x, p.z - PILE.z) < 3.2 || Math.hypot(p.x - truck.g.position.x, p.z - 10) < 3.5) { callTruck(); return; }
    let bt = null, bd = 2.6;
    for (const t of tractors) { const d = Math.hypot(t.x - p.x, t.z - p.z); if (d < bd) { bd = d; bt = t; } }
    if (bt) { selectT(bt); AU.click(); return; }
    let tree = null; bd = 1.9;
    for (const t of trees) { if (t.state !== 'grown') continue; const d = Math.hypot(t.x - p.x, t.z - p.z); if (d < bd) { bd = d; tree = t; } }
    ptr.goal = { x: p.x, z: p.z, tree }; sel.manualT = 3; sel.release(); sel.wander = null;
  } else if (ptr.goal) { ptr.goal.x = p.x; ptr.goal.z = p.z; ptr.goal.tree = null; sel.manualT = 3; }
}
canvas.addEventListener('pointerdown', e => { if (menuMode) return; AU.init(); ptr.down = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} handlePtr(e, true); });
canvas.addEventListener('pointermove', e => { if (ptr.down) handlePtr(e, false); });
const pup = () => { ptr.down = false; };
canvas.addEventListener('pointerup', pup); canvas.addEventListener('pointercancel', pup);
function selectT(t) { sel = t; syncAuto(); }
function selectNext() { if (!tractors.length) return; selectT(tractors[(tractors.indexOf(sel) + 1) % tractors.length]); toast('Traktor ' + (tractors.indexOf(sel) + 1) + ' ausgewählt'); }

const selRing = new THREE.Mesh(new THREE.RingGeometry(1.6, 1.95, 32), new THREE.MeshBasicMaterial({ color: 0xffe45c, transparent: true, opacity: .9, depthWrite: false, side: THREE.DoubleSide }));
selRing.rotation.x = -Math.PI / 2; scene.add(selRing);
const goalRing = new THREE.Mesh(new THREE.RingGeometry(.5, .8, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .9, depthWrite: false, side: THREE.DoubleSide }));
goalRing.rotation.x = -Math.PI / 2; goalRing.visible = false; scene.add(goalRing);

/* ================= boost / actions ================= */
let boostT = 0;
function activateBoost() {
  if (boostT > 0) return; if (save.boostCd > 0) { toast('⚡ Turbo lädt noch ' + Math.ceil(save.boostCd) + ' s'); AU.err(); return; }
  boostT = S.boostDur; save.boostCd = S.boostDur + 45; AU.boost(); toast('⚡ TURBO! Alles läuft doppelt so schnell!');
}
function callTruck() {
  if (save.pl < 1) { toast('Noch keine Bretter im Lager!'); AU.err(); return; }
  if (truck.state !== 'idle') { toast('Der LKW ist schon unterwegs 🚚'); return; }
  truck.call = true; truck.cd = 0; AU.click();
}

/* ================= shop UI ================= */
let buyN = 1;
function costN(u, l, k) { let s = 0; for (let i = 0; i < k; i++) s += ucost(u, l + i); return s; }
function plan(u) {
  const l = ulv(u); if (l >= u.max) return null;
  let k = buyN;
  if (!buyN) { k = 0; let c = 0; while (l + k < u.max) { const nc = ucost(u, l + k); if (c + nc > save.coins) break; c += nc; k++; } k = Math.max(1, k); }
  k = Math.min(k, u.max - l); return { l, k, cost: costN(u, l, k) };
}
function buildShop() {
  const list = $('shopList'), tabs = $('shopTabs'); list.innerHTML = ''; tabs.innerHTML = '';
  GROUPS.forEach((gn, gi) => {
    const b = document.createElement('button'); b.className = 'st'; b.textContent = gn; b.onclick = () => { AU.click(); const h = $('sg' + gi); list.scrollTo({ top: h.offsetTop - 6, behavior: 'smooth' }); }; tabs.appendChild(b);
    const h = document.createElement('h4'); h.id = 'sg' + gi; h.textContent = gn; list.appendChild(h);
    UL.filter(u => u.g === gi).forEach(u => {
      const el = document.createElement('div'); el.className = 'up';
      el.innerHTML = `<div class="ui">${u.ic}</div><div class="um"><b>${u.n}</b><small>${u.d}</small><div class="bar"><i></i></div><div class="ue"></div></div><button class="st buy"></button>`;
      el.querySelector('.buy').onclick = () => buy(u); list.appendChild(el); u.el = el;
    });
  });
  const rb = document.createElement('button'); rb.className = 'st'; rb.style.cssText = 'min-height:36px;font-size:13px;margin:10px auto 0;flex:none'; rb.textContent = '🗑️ Spielstand löschen';
  rb.onclick = resetGame; list.appendChild(rb);
}
function refreshShop() {
  $('shopBal').textContent = fmt(save.coins);
  for (const u of UL) {
    const el = u.el; if (!el) continue; const l = ulv(u), p = plan(u), btn = el.querySelector('.buy');
    el.querySelector('.bar i').style.width = (l / u.max * 100) + '%';
    el.querySelector('.ue').textContent = u.special ? `${u.fm(u.val(l))}` : `Stufe ${l}/${u.max} · ${u.fm(u.val(l))}` + (p ? ` → ${u.fm(u.val(l + p.k))}` : '');
    if (!p) { btn.textContent = 'MAX'; btn.className = 'st buy max'; }
    else { btn.innerHTML = `💰 ${fmt(p.cost)}` + (p.k > 1 ? `<small>×${p.k}</small>` : ''); btn.className = 'st buy' + (save.coins >= p.cost ? ' go' : ' no'); }
  }
}
function buy(u) {
  const p = plan(u); if (!p) return;
  if (save.coins < p.cost) { AU.err(); toast('Nicht genug Münzen 💰'); return; }
  save.coins -= p.cost;
  if (u.special) { for (let i = 0; i < p.k; i++) addTractor(); } else save.up[u.id] = p.l + p.k;
  recalc(); tractors.forEach(t => t.applyBlade()); AU.buy(); refreshShop(); refreshHud(true); persist();
}
function addTractor() {
  save.tractors++; const t = new Tractor(tractors.length); tractors.push(t); t.x = -9; t.z = 7; return t;
}
document.querySelectorAll('.mult .st').forEach(b => b.onclick = () => { buyN = +b.dataset.m; document.querySelectorAll('.mult .st').forEach(x => x.classList.toggle('on', x === b)); AU.click(); refreshShop(); });

/* ---- forests ---- */
function renderForests() {
  $('forBal').textContent = fmt(save.coins);
  const grid = $('forGrid'); grid.innerHTML = '';
  LV.forEach((L, i) => {
    const owned = i < save.unlocked, next = i === save.unlocked, cur = i === save.level;
    const el = document.createElement('div'); el.className = 'fc' + (cur ? ' cur' : '') + (!owned && !next ? ' lock' : '');
    const hex = c => '#' + c.toString(16).padStart(6, '0');
    el.innerHTML = `<div class="sw" style="background:linear-gradient(${hex(L.sky)},${hex(L.ground)})">${owned || next ? L.e : '🔒'}</div><div class="fi"><b>${i + 1}. ${L.n}</b><small>Brett-Wert ×${fmt(L.price)} · Bäume ${fmt(L.hp)} LP</small></div>`;
    const b = document.createElement('button'); b.className = 'st';
    if (owned) { b.textContent = cur ? '✔ Hier' : 'Betreten ▶'; b.className += cur ? ' warm' : ' go'; b.onclick = () => { if (!cur) { loadLevel(i); AU.click(); closeModals(); toast(L.e + ' ' + L.n); } }; }
    else if (next) { b.innerHTML = '💰 ' + fmt(L.cost) + ' kaufen'; b.className += save.coins >= L.cost ? ' go' : ' no off'; b.onclick = () => { if (save.coins < L.cost) { AU.err(); toast('Nicht genug Münzen 💰'); return; } save.coins -= L.cost; save.unlocked = i + 1; AU.fan(); persist(); loadLevel(i); closeModals(); toast('🎉 Neuer Wald: ' + L.n + '!'); }; }
    else { b.textContent = 'Gesperrt'; b.disabled = true; b.className += ' off'; }
    el.appendChild(b); grid.appendChild(el);
  });
}

/* ---- modals ---- */
let openModal = null;
function toggleModal(id) { if (openModal === id) closeModals(); else showModal(id); }
function showModal(id) {
  if (menuMode) return; closeModals(); openModal = id; $(id).classList.remove('hide'); AU.click();
  if (id === 'shop') refreshShop(); if (id === 'forests') renderForests();
}
function closeModals() { for (const id of ['shop', 'forests']) $(id).classList.add('hide'); openModal = null; }
$('btnShop').onclick = () => showModal('shop'); $('btnForest').onclick = () => showModal('forests');
$('shopX').onclick = closeModals; $('forX').onclick = closeModals;
for (const id of ['shop', 'forests']) $(id).addEventListener('pointerdown', e => { if (e.target === $(id)) closeModals(); });
function resetGame() { if (confirm('Wirklich den ganzen Spielstand löschen?')) { try { localStorage.removeItem(KEY); } catch (e) {} save = defSave(); persist(); location.reload(); } }

/* ---- HUD ---- */
function syncAuto() { const b = $('btnAuto'); if (!sel) return; b.textContent = sel.autoOff ? '🕹️ Manuell' : '🤖 Auto'; b.classList.toggle('warm', !!sel.autoOff); }
$('btnAuto').onclick = () => { if (!sel) return; sel.autoOff = !sel.autoOff; sel.manualT = 0; sel.release(); AU.click(); syncAuto(); toast(sel.autoOff ? 'Dieser Traktor wartet auf dich' : 'Dieser Traktor fährt wieder automatisch'); };
$('btnBoost').onclick = activateBoost; $('btnSell').onclick = callTruck;
$('btnSnd').onclick = () => { save.sfx = !save.sfx; AU.init(); if (AU.sfx) AU.sfx.gain.value = save.sfx ? 1 : 0; syncSnd(); persist(); };
$('btnMus').onclick = () => { save.music = !save.music; AU.init(); if (AU.mus) AU.mus.gain.value = save.music ? .5 : 0; syncSnd(); persist(); };
function syncSnd() { $('btnSnd').textContent = save.sfx ? '🔊' : '🔇'; $('btnMus').textContent = save.music ? '🎵' : '🚫'; $('btnMus').style.opacity = save.music ? 1 : .6; }
$('btnFs').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); } catch (e) {} };
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('btnFs').classList.add('hide');
$('rotOk').onclick = () => { rotDismissed = true; $('rotate').classList.add('hide'); };

let lastDot = false;
function refreshHud(force) {
  $('coinV').textContent = fmt(save.coins);
  $('rateV').textContent = '+' + fmt(save.rate) + '/s';
  $('lvlName').textContent = curLv.e + ' ' + curLv.n;
  const grown = trees.filter(t => t.state === 'grown').length; $('treeV').textContent = grown + '/' + trees.length;
  $('chLogs').textContent = '🪵 ' + Math.floor(save.inLogs) + '/' + fmt(S.store);
  $('chPlank').textContent = '📦 ' + Math.floor(save.pl) + '/' + fmt(plCap());
  $('chTruck').textContent = truck.state === 'idle' ? (truck.cd > .5 ? '🚚 in ' + Math.ceil(truck.cd) + ' s' : '🚚 bereit') : '🚚 unterwegs';
  const bb = $('btnBoost'); const bar = $('boostBar');
  if (boostT > 0) { bb.firstChild.textContent = '⚡ ' + Math.ceil(boostT) + ' s'; bar.style.width = (boostT / S.boostDur * 100) + '%'; }
  else if (save.boostCd > 0) { bb.firstChild.textContent = '⏳ ' + Math.ceil(save.boostCd) + ' s'; bar.style.width = '0'; }
  else { bb.firstChild.textContent = '⚡ Turbo'; bar.style.width = '0'; }
  bb.classList.toggle('off', boostT <= 0 && save.boostCd > 0);
  let dot = false; for (const u of UL) { const l = ulv(u); if (l < u.max && save.coins >= ucost(u, l)) { dot = true; break; } }
  if (!dot && save.unlocked < LV.length && save.coins >= LV[save.unlocked].cost) dot = true;
  if (dot !== lastDot || force) { $('shopDot').classList.toggle('hide', !dot); lastDot = dot; }
  if (openModal === 'shop') refreshShop(); else if (openModal === 'forests' && force) renderForests();
}

/* ---- offline / tutorial / menu ---- */
function awardOffline(sec) {
  if (sec < 30 || save.rate <= 0) return;
  const s = Math.min(sec, 4 * 3600), amt = save.rate * s * S.offline; if (amt < 1) return;
  gain(amt); $('offTxt').textContent = `Du warst ${s >= 3600 ? (s / 3600).toFixed(1) + ' Std.' : Math.round(s / 60) + ' Min.'} weg – deine Nachtschicht (${Math.round(S.offline * 100)}%) hat gearbeitet:`;
  $('offAmt').textContent = '💰 ' + fmt(amt); $('offline').classList.remove('hide');
}
$('offOk').onclick = () => { $('offline').classList.add('hide'); AU.coin(); };
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); persist(); } else if (hiddenAt && !menuMode) { awardOffline((Date.now() - hiddenAt) / 1000); hiddenAt = 0; } });

const TUT = [
  ['🚜 Traktoren am Werk!', 'Deine Traktoren fällen Bäume ganz von allein – die Kreissäge vorne zersägt alles, was ihr zu nah kommt.'],
  ['🪚 Vom Stamm zum Geld', 'Die Stämme kommen ins Sägewerk, werden zu Brettern und ein LKW fährt sie zum Markt. Tippe auf den Stapel, um den LKW sofort zu rufen!'],
  ['👆 Du hast das Steuer', 'Tippe oder ziehe auf die Wiese, um einen Traktor zu steuern (oder WASD / Pfeiltasten). Tippe einen Traktor an, um ihn zu wählen. Kauf im Laden Upgrades und neue Wälder!'],
];
let tutI = 0;
function showTut() { $('tut').classList.remove('hide'); $('tutDots').innerHTML = TUT.map((_, i) => `<i class="${i === tutI ? 'on' : ''}"></i>`).join(''); $('tutH').textContent = TUT[tutI][0]; $('tutP').textContent = TUT[tutI][1]; $('tutNext').textContent = tutI === TUT.length - 1 ? 'Los geht\'s! ▶' : 'Weiter ▶'; }
$('tutNext').onclick = () => { AU.click(); if (++tutI >= TUT.length) { $('tut').classList.add('hide'); save.seen = true; persist(); } else showTut(); };

$('menuSub').textContent = hadSave ? `Weiter geht's! 💰 ${fmt(save.coins)} · Wald ${save.level + 1}/${LV.length}` : '12 Wälder · 16 Upgrades · Idle-Spaß';
$('btnPlay').textContent = hadSave ? 'WEITER ▶' : 'SPIELEN ▶';
$('btnPlay').onclick = () => {
  AU.init(); AU.click(); menuMode = false; $('menu').classList.add('hide'); $('hud').classList.remove('hide'); yaw = 0; placeCam(camDist); fit();
  try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  if (pendingAway > 0) { awardOffline(pendingAway); pendingAway = 0; }
  if (!save.seen) { tutI = 0; showTut(); }
};

/* ================= boot ================= */
for (let i = 0; i < save.tractors; i++) tractors.push(new Tractor(i));
sel = tractors[0]; syncAuto(); syncSnd(); buildShop();
let pendingAway = hadSave ? (Date.now() - save.t) / 1000 : 0;
// start inventory sanity
save.inLogs = Math.max(0, save.inLogs || 0); save.pl = Math.max(0, save.pl || 0);
loadLevel(clamp(save.level, 0, save.unlocked - 1));
fit();

/* ================= main loop ================= */
let now = 0, lastTs = performance.now(), hudT = 0;
function step(dt) {
  now += dt;
  if (boostT > 0) boostT = Math.max(0, boostT - dt);
  if (save.boostCd > 0) save.boostCd = Math.max(0, save.boostCd - dt);
  for (const t of tractors) t.update(dt, now);
  updateTrees(dt, now); updateLogs(dt); updateMill(dt, now); updateFeeds(dt); updateParticles(dt); updateWeather(dt, now); trackRate(dt);
}
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = clamp(((ts || performance.now()) - lastTs) / 1000, 0, .05); lastTs = ts || performance.now();
  step(dt);
  for (const c of clouds) { c.position.x += c.userData.sp * dt; if (c.position.x > 85) c.position.x = -85; }
  if (sel && !menuMode) {
    selRing.visible = tractors.length > 1 || ptr.goal != null; selRing.position.set(sel.x, .06, sel.z); selRing.scale.setScalar(1 + Math.sin(now * 5) * .05);
    const g = ptr.goal; goalRing.visible = !!g;
    if (g) { const tx = g.tree ? g.tree.x : g.x, tz = g.tree ? g.tree.z : g.z; goalRing.position.set(tx, .08, tz); goalRing.scale.setScalar(1 + Math.sin(now * 8) * .15); }
  } else { selRing.visible = false; goalRing.visible = false; }
  let cut = 0, mv = 0; for (const t of tractors) { if (t.cutting) cut++; mv += t.sp; }
  AU.update(dt, cut, mv / Math.max(1, tractors.length), mill.active ? 1 : 0);
  if (menuMode) { yaw = Math.sin(now * .15) * .35; placeCam(camDist); }
  updateFloats(dt);
  hudT -= dt; if (hudT <= 0) { hudT = .2; refreshHud(); }
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);
</script>
