<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b3a8c">
<title>Max Blast</title>
<meta name="description" content="Max Blast – ziehe Blöcke aufs Brett, räume Reihen frei und jage Combos! Mit Abenteuer-Modus, Edelsteinen und Skins.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b3a8c'/%3E%3Crect x='8' y='8' width='22' height='22' rx='5' fill='%23ffd449'/%3E%3Crect x='34' y='8' width='22' height='22' rx='5' fill='%23ff5a4a'/%3E%3Crect x='8' y='34' width='22' height='22' rx='5' fill='%233dbb5b'/%3E%3Crect x='34' y='34' width='22' height='22' rx='5' fill='%233d8dff'/%3E%3C/svg%3E">
<style>
:root{--ink:#3a2418;--cream:#fff4dc;--butter:#ffd449;--leaf:#3dbb5b;--red:#ff5a4a;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --font:ui-rounded,"Arial Rounded MT Bold","Varela Round","Trebuchet MS",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1a2255;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.st{pointer-events:auto;min-width:48px;min-height:48px;border:3px solid var(--ink);border-radius:18px;background:var(--cream);color:var(--ink);font:700 18px/1 var(--font);padding:0 16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none}
.st:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.st:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
.st.go{background:var(--leaf);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.st.warm{background:var(--butter)}
.st.red{background:var(--red);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.st.big{min-height:62px;font-size:23px;padding:0 28px;border-radius:22px}
#pauseBtn{position:absolute;left:calc(var(--safe-l) + 12px);top:calc(var(--safe-t) + 12px);z-index:5;min-height:46px;padding:0 14px}
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 14px)}
#menu{justify-content:center;background:radial-gradient(circle at 50% 30%,#5b74f0,#2b3a8c 60%,#141b4d)}
#menu h1{font-size:min(17vw,86px);line-height:.92;text-align:center;color:#fff;letter-spacing:-1px;text-shadow:0 6px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);animation:bob 2.4s ease-in-out infinite}
#menu h1 em{font-style:normal;color:var(--butter)}
.logo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(34vw,150px);margin-bottom:18px;animation:wob 2.4s ease-in-out infinite}
.logo i{aspect-ratio:1;border-radius:22%;border:3px solid rgba(0,0,0,.35);box-shadow:inset 0 5px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2);animation:blink 3s infinite}
@keyframes blink{0%,80%,100%{transform:scale(1)}90%{transform:scale(.8)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
#menu .sub{margin:12px 0 22px;font-weight:700;color:#dfe5ff;font-size:16px;text-align:center}
#menu .col{display:flex;flex-direction:column;gap:14px;width:min(80vw,320px)}
.row{display:flex;gap:12px}.row .st{flex:1}
.back{position:absolute;left:calc(var(--safe-l) + 12px);top:calc(var(--safe-t) + 12px);z-index:3;min-height:42px;font-size:15px;padding:0 12px;border-radius:14px}
.badge{position:absolute;right:calc(var(--safe-r) + 12px);top:calc(var(--safe-t) + 12px);z-index:3;background:var(--cream);border:3px solid var(--ink);border-radius:14px;min-height:42px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--ink)}
.sub-screen{background:linear-gradient(#3b4ec0,#1a2255)}
.sub-screen h2{margin-top:46px;font-size:28px;color:#fff;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.scroll{flex:1;width:100%;max-width:520px;overflow-y:auto;margin:12px 0;padding:6px 4px 14px;touch-action:pan-y}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.th{border:4px solid var(--ink);border-radius:20px;background:var(--cream);padding:10px;text-align:center;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--ink);position:relative}
.th canvas{width:100%;aspect-ratio:2;display:block;border-radius:12px;margin-bottom:6px}
.th.sel{background:var(--butter)}
.th.lock{filter:grayscale(.8);opacity:.8;cursor:default}
.th small{display:block;font-weight:700;font-size:12px;opacity:.8}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;background:var(--cream);font:800 20px/1 var(--font);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.lv small{font-size:11px;color:#e8a30c;letter-spacing:-1px;height:12px}
.lv.cur{background:var(--butter);animation:pulse 1s infinite}
.lv.lock{background:#b8b9d6;color:#7f81a8;cursor:default;box-shadow:0 2px 0 var(--ink);transform:translateY(2px)}
@keyframes pulse{50%{transform:scale(1.07)}}
#end,#pause{background:rgba(20,27,77,.72);justify-content:center;gap:14px}
#end .card{width:min(100%,380px);background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:18px 18px 20px;text-align:center;box-shadow:0 7px 0 var(--ink);animation:up .5s cubic-bezier(.2,1.3,.4,1) both}
#end h3{font-size:30px}
#end .big-n{font-size:56px;font-weight:900;line-height:1.1;color:#e8531f;text-shadow:0 3px 0 rgba(58,36,24,.2)}
#end p{font-weight:700;margin:6px 0 14px;line-height:1.35}
#end .btns{display:flex;flex-direction:column;gap:10px}
#end .stars{font-size:44px;letter-spacing:4px;margin:4px 0;color:#d9c9a3}
#end .stars i{font-style:normal;display:inline-block}
#end .stars i.on{color:#ffc61a;animation:starpop .5s cubic-bezier(.2,1.8,.4,1) both}
#end .stars i:nth-child(2){animation-delay:.25s}#end .stars i:nth-child(3){animation-delay:.5s}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
@keyframes up{from{transform:translateY(60px) scale(.8);opacity:0}}
#pause h2{color:#fff;font-size:36px;text-shadow:0 4px 0 var(--ink);margin-bottom:6px}
#pause .st{width:min(70vw,280px)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <button class="st" id="pauseBtn" aria-label="Pause">⏸</button>

  <div id="menu" class="screen">
    <a class="st back" href="../">← maxdittes.com</a>
    <div class="badge">🏆 <span id="bestN">0</span></div>
    <div class="logo" id="logo"></div>
    <h1>MAX<br><em>BLAST</em></h1>
    <p class="sub">Blöcke ziehen, Reihen räumen, Combos jagen!</p>
    <div class="col">
      <button class="st go big" id="classicBtn">▶ Klassisch</button>
      <button class="st warm big" id="advBtn">💎 Abenteuer</button>
      <div class="row">
        <button class="st" id="skinBtn">🎨 Stile</button>
        <button class="st" id="sndBtn">🔊 Ton</button>
        <button class="st" id="howBtn">❓</button>
      </div>
    </div>
  </div>

  <div id="levels" class="screen sub-screen hide">
    <button class="st back" data-go="menu">← Zurück</button>
    <h2>💎 Abenteuer</h2>
    <div class="scroll"><div class="lvgrid" id="lvGrid"></div></div>
  </div>

  <div id="themes" class="screen sub-screen hide">
    <button class="st back" data-go="menu">← Zurück</button>
    <h2>Block-Stile</h2>
    <div class="scroll"><div class="themes" id="thGrid"></div></div>
  </div>

  <div id="pause" class="screen hide">
    <h2>⏸ Pause</h2>
    <button class="st go big" id="resumeBtn">▶ Weiter</button>
    <button class="st warm" id="restartBtn">↻ Neustart</button>
    <button class="st" id="quitBtn">🏠 Menü</button>
    <a class="st" href="../">← maxdittes.com</a>
  </div>

  <div id="end" class="screen hide"></div>
  <canvas id="fx"></canvas>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - t, 3), back = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);

/* ------------------------------------------------ save */
const KEY = 'maxblast.v1';
const defSave = () => ({ best: 0, lines: 0, theme: 'classic', sound: true, unlocked: 1, stars: {} });
let save = defSave();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(defSave(), s); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

/* ------------------------------------------------ colours / themes */
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (h, t, k) => { const a = hexRgb(h), b = hexRgb(t); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`; };
const BASE = ['#ff5a4a', '#ff9a2e', '#ffd23f', '#3ec95e', '#22c5b8', '#3d8dff', '#9b5cf0', '#ff6fb5'];
const PAL = BASE.map(m => ({ m, l: mixc(m, '#ffffff', .45), l2: mixc(m, '#ffffff', .2), d: mixc(m, '#000000', .38), pastel: mixc(m, '#ffffff', .62) }));
const FOOD = ['🍎', '🍊', '🍋', '🍏', '🫐', '🍇', '🍓', '🍑'];
const THEMES = {
  classic: { name: 'Klassik', need: 0, bg: ['#3b4ec0', '#141b4d'], board: '#1b2358', cell: 'rgba(255,255,255,.07)', fg: '#fff', accent: '#ffd449' },
  food:    { name: 'Lecker', need: 0, bg: ['#ffe9b8', '#ff9b6b'], board: '#7a3b2c', cell: 'rgba(255,230,200,.12)', fg: '#3a2418', accent: '#d8421c' },
  candy:   { name: 'Bonbon', need: 800, bg: ['#ffb6e0', '#a96bff'], board: '#5a2d96', cell: 'rgba(255,255,255,.1)', fg: '#fff', accent: '#ffe14d' },
  neon:    { name: 'Neon', need: 2500, bg: ['#12002e', '#000000'], board: '#0a0720', cell: 'rgba(120,120,255,.12)', fg: '#fff', accent: '#00f0ff' },
};
const emojiSpr = {};
function emojiSprite(e) {
  if (emojiSpr[e]) return emojiSpr[e];
  const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d');
  g.font = '70px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 48, 52);
  return emojiSpr[e] = c;
}
function drawTile(g, x, y, s, ci, style, a = 1) {
  const p = PAL[ci], pad = s * .05; x += pad; y += pad; s -= pad * 2; const r = s * .2;
  g.save(); g.globalAlpha *= a;
  const rr = (rx, ry, w, h, rad) => { g.beginPath(); g.roundRect(rx, ry, w, h, rad); };
  if (style === 'neon') {
    rr(x, y, s, s, r); g.fillStyle = '#0b0b26'; g.fill();
    g.shadowColor = p.m; g.shadowBlur = s * .35; g.lineWidth = s * .09; g.strokeStyle = p.m; rr(x + s * .06, y + s * .06, s * .88, s * .88, r); g.stroke(); g.shadowBlur = 0;
    g.fillStyle = p.m; g.globalAlpha *= .85; rr(x + s * .3, y + s * .3, s * .4, s * .4, r * .5); g.fill();
  } else if (style === 'candy') {
    const gr = g.createRadialGradient(x + s * .35, y + s * .3, s * .05, x + s * .5, y + s * .5, s * .7); gr.addColorStop(0, p.l); gr.addColorStop(.5, p.m); gr.addColorStop(1, p.d);
    rr(x, y, s, s, s * .36); g.fillStyle = gr; g.fill(); g.lineWidth = s * .05; g.strokeStyle = p.d; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(x + s * .32, y + s * .26, s * .17, s * .09, -.6, 0, 6.3); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = s * .07; g.beginPath(); g.moveTo(x + s * .25, y + s * .78); g.lineTo(x + s * .78, y + s * .25); g.stroke();
  } else if (style === 'food') {
    rr(x, y + s * .06, s, s, r); g.fillStyle = p.d; g.fill();
    rr(x, y, s, s * .96, r); g.fillStyle = p.pastel; g.fill();
    g.lineWidth = s * .05; g.strokeStyle = p.m; g.stroke();
    const e = emojiSprite(FOOD[ci]), q = s * .86; g.drawImage(e, x + (s - q) / 2, y + (s - q) / 2 - s * .02, q, q);
  } else {
    rr(x, y + s * .07, s, s * .93, r); g.fillStyle = p.d; g.fill();
    const gr = g.createLinearGradient(0, y, 0, y + s); gr.addColorStop(0, p.l2); gr.addColorStop(1, p.m);
    rr(x, y, s, s * .93, r); g.fillStyle = gr; g.fill();
    g.fillStyle = 'rgba(255,255,255,.28)'; rr(x + s * .1, y + s * .08, s * .8, s * .16, r * .6); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1.5; rr(x, y, s, s * .93, r); g.stroke();
  }
  g.restore();
}

/* ------------------------------------------------ pieces */
const BASE_SHAPES = [
  ['1', [[0, 0]]],
  ['i2', [[0, 0], [0, 1]]], ['i3', [[0, 0], [0, 1], [0, 2]]], ['i4', [[0, 0], [0, 1], [0, 2], [0, 3]]], ['i5', [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]]],
  ['o', [[0, 0], [0, 1], [1, 0], [1, 1]]], ['o3', [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]]],
  ['r23', [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]]],
  ['l2', [[0, 0], [1, 0], [1, 1]]], ['l3', [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]]],
  ['t', [[0, 0], [0, 1], [0, 2], [1, 1]]], ['s', [[0, 1], [0, 2], [1, 0], [1, 1]]], ['z', [[0, 0], [0, 1], [1, 1], [1, 2]]],
  ['j', [[0, 0], [1, 0], [2, 0], [2, 1]]], ['l', [[0, 1], [1, 1], [2, 1], [2, 0]]],
  ['plus', [[0, 1], [1, 0], [1, 1], [1, 2], [2, 1]]],
];
const norm = cells => { const mr = Math.min(...cells.map(c => c[0])), mc = Math.min(...cells.map(c => c[1])); return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]); };
const rot = cells => norm(cells.map(([r, c]) => [c, -r]));
const SHAPES = [];
for (const [name, cells] of BASE_SHAPES) {
  const seen = new Set(); let cur = norm(cells);
  for (let k = 0; k < 4; k++) { const key = JSON.stringify(cur); if (!seen.has(key)) { seen.add(key); SHAPES.push({ name, cells: cur, n: cur.length, h: Math.max(...cur.map(c => c[0])) + 1, w: Math.max(...cur.map(c => c[1])) + 1 }); } cur = rot(cur); }
}
const WEIGHT = { '1': .5, i2: 1, i3: 1.1, i4: .9, i5: .7, o: 1.2, o3: .5, r23: .8, l2: 1.2, l3: .8, t: 1, s: .8, z: .8, j: 1, l: 1, plus: .5 };

/* ------------------------------------------------ board logic */
const G = 8;
let grid, gems, pieces, score, combo, noClear, moves, mode, level, goal, collected, over = false, linesRun = 0, perfects = 0, bestCombo = 0;
const fitsAt = (occ, sh, r, c) => { for (const [dr, dc] of sh.cells) { const y = r + dr, x = c + dc; if (y < 0 || x < 0 || y >= G || x >= G || occ[y * G + x]) return false; } return true; };
function canPlaceAnywhere(occ, sh) { for (let r = 0; r <= G - sh.h; r++) for (let c = 0; c <= G - sh.w; c++) if (fitsAt(occ, sh, r, c)) return true; return false; }
function simPlace(occ, sh, r, c) {
  const o = occ.slice(); for (const [dr, dc] of sh.cells) o[(r + dr) * G + c + dc] = 1;
  const rows = [], cols = [];
  for (let i = 0; i < G; i++) { let f = true, h = true; for (let j = 0; j < G; j++) { if (!o[i * G + j]) f = false; if (!o[j * G + i]) h = false; } if (f) rows.push(i); if (h) cols.push(i); }
  for (const i of rows) for (let j = 0; j < G; j++) o[i * G + j] = 0;
  for (const i of cols) for (let j = 0; j < G; j++) o[j * G + i] = 0;
  return o;
}
function solvable(occ, list) {
  if (!list.length) return true;
  for (let k = 0; k < list.length; k++) {
    const sh = list[k], rest = list.filter((_, i) => i !== k);
    for (let r = 0; r <= G - sh.h; r++) for (let c = 0; c <= G - sh.w; c++) if (fitsAt(occ, sh, r, c) && solvable(simPlace(occ, sh, r, c), rest)) return true;
  }
  return false;
}
const occOf = () => grid.map(v => v >= 0 ? 1 : 0);
function rollShape(hard) {
  let tot = 0; const w = SHAPES.map(s => { let x = WEIGHT[s.name] || 1; if (hard) x *= (s.n >= 5 ? 1 + hard * 1.5 : s.n <= 2 ? 1 - hard * .6 : 1); tot += x; return x; });
  let r = Math.random() * tot; for (let i = 0; i < SHAPES.length; i++) { r -= w[i]; if (r <= 0) return SHAPES[i]; } return SHAPES[0];
}
function dealPieces() {
  const occ = occOf(); const hard = mode === 'classic' ? clamp(score / 4000, 0, 1) : clamp(level / 30, 0, .9);
  let best = null;
  for (let t = 0; t < 60; t++) {
    const tri = [rollShape(hard), rollShape(hard), rollShape(hard)];
    if (!tri.every(s => canPlaceAnywhere(occ, s))) { if (!best && tri.some(s => canPlaceAnywhere(occ, s))) best = tri; continue; }
    if (Math.random() < .1 || solvable(occ, tri)) { best = tri; break; }
  }
  if (!best) best = [SHAPES[0], SHAPES[1], SHAPES[0]];
  const cols = [0, 1, 2, 3, 4, 5, 6, 7].sort(() => Math.random() - .5);
  pieces = best.map((sh, i) => ({ sh, color: cols[i], placed: false, sc: .72, x: 0, y: 0, drag: false, born: now() }));
}
const now = () => performance.now() / 1000;

/* ------------------------------------------------ canvas layout */
const cv = $('#c'), ctx = cv.getContext('2d'), fxc = $('#fx'), fx = fxc.getContext('2d');
let W = 0, H = 0, dpr = 1, L = {};
function layout() {
  dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [cv, fxc]) { c.width = W * dpr; c.height = H * dpr; }
  const top = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-t')) || 0);
  const hdr = Math.max(124, H * .15) + top, bottomPad = 16 + 0;
  const avail = H - hdr - bottomPad;
  let bs = Math.min(W - 20, avail * .66); bs = Math.max(200, bs);
  const cell = bs / G;
  L = { hdr, bs, cell, bx: (W - bs) / 2, by: hdr, trayY: hdr + bs + 10, trayH: Math.max(cell * 3.2, H - hdr - bs - 18), slotW: W / 3 };
}
addEventListener('resize', layout);

/* ------------------------------------------------ effects */
let tilesAnim = [], fades = [], parts = [], floats = [], banners = [], shake = 0, confs = [], flyGems = [], overAnim = 0, lastClearT = 0;
const cellXY = (r, c) => [L.bx + c * L.cell, L.by + r * L.cell];
function burst(x, y, col, n, sp = 260) { for (let i = 0; i < n && parts.length < 500; i++) { const a = rnd(0, 6.283), s = rnd(.2, 1) * sp; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90, t: 0, max: rnd(.4, .9), sz: rnd(3, 8), col, rot: rnd(0, 6), vr: rnd(-12, 12) }); } }
function banner(text, sub, col) { banners.push({ text, sub, col, t: 0, max: 1.3 }); }

    const i = r * G + c, v = grid[i]; if (v < 0) continue;
    let s = cell, ox2 = 0, a = 1; const an = tilesAnim.find(q => q.i === i);
    let wob = 0; if (an) { const k = clamp((tt - an.t0) / .3, 0, 1); s = cell * (1 + (1 - k) * .0) ; wob = Math.sin(k * Math.PI) * cell * .12; }
    if (over) { const k = clamp((tt - overAnim) * 3 - (r + c) * .12, 0, 1); a = 1 - k * .0; }
    ctx.save(); if (previewLines && previewLines.has(i)) { ctx.translate(0, 0); }
    const px = bx + c * cell - wob / 2, py = by + r * cell - wob / 2; drawTile(ctx, px, py, cell + wob, v, save.theme, a);
    if (over) { const k = clamp((tt - overAnim) * 3 - (r + c) * .12, 0, .6); ctx.fillStyle = `rgba(80,80,100,${k})`; ctx.beginPath(); ctx.roundRect(px + 3, py + 3, cell - 6, cell - 6, cell * .16); ctx.fill(); }
    if (gems[i]) { const bob = Math.sin(tt * 4 + i) * 2; ctx.font = `${cell * .6}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.drawImage(emojiSprite('💎'), px + cell * .17, py + cell * .12 + bob, cell * .66, cell * .66); }
    ctx.restore();
  }
  // fading (cleared) tiles
  for (const f of fades) {
    const k = (tt - f.t0) / .45; if (k < 0) { const r = (f.i / G) | 0, c = f.i % G; drawTile(ctx, bx + c * cell, by + r * cell, cell, f.color, save.theme, 1); continue; }
    const r = (f.i / G) | 0, c = f.i % G, s = cell * (1 - ease(k) * .9) * (k < .15 ? 1 + k * 1.2 : 1); const cx = bx + c * cell + cell / 2, cy = by + r * cell + cell / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(k * 1.2); ctx.globalAlpha = 1 - k; drawTile(ctx, -s / 2, -s / 2, s, f.color, save.theme, 1);
    if (k < .3) { ctx.fillStyle = `rgba(255,255,255,${(.3 - k) * 3})`; ctx.fillRect(-s / 2, -s / 2, s, s); } ctx.restore();
  }
  ctx.restore();
  // tray + dragged piece
  for (let i = 0; i < 3; i++) {
    const p = pieces[i]; if (p.placed) continue;
    const age = clamp((tt - p.born - i * .08) / .4, 0, 1), sp = back(age);
    let x, y, s = L.cell * p.sc;
    if (p.drag && drag) { const g = dragGeom(); x = g.x; y = g.y; s = L.cell; }
    else { const h = pieceHome(i, p); x = h.x; y = h.y + (1 - age) * 80; s = L.cell * p.sc; }
    ctx.save(); ctx.globalAlpha = p.drag ? 1 : clamp(age * 2, 0, 1);
    if (p.drag) { ctx.fillStyle = 'rgba(0,0,0,.25)'; for (const [dr, dc] of p.sh.cells) { ctx.beginPath(); ctx.roundRect(x + dc * s + 4, y + dr * s + 16, s - 2, s - 2, s * .2); ctx.fill(); } }
    const cx = x + p.sh.w * s / 2, cy = y + p.sh.h * s / 2; ctx.translate(cx, cy); const sc2 = p.drag ? 1 : (sp || 0); ctx.scale(sc2, sc2); ctx.translate(-cx, -cy);
    for (const [dr, dc] of p.sh.cells) drawTile(ctx, x + dc * s, y + dr * s, s, p.color, save.theme);
    ctx.restore();
  }
  // gems flying to counter
  for (const g of flyGems) { const k = clamp((tt - g.t0) / .8, 0, 1); if (k <= 0) continue; const tx = L.gemX || W - 40, ty = L.gemY || 40, e = ease(k); const x = g.x + (tx - g.x) * e, y = g.y + (ty - g.y) * e - Math.sin(k * Math.PI) * 60; ctx.globalAlpha = 1; ctx.drawImage(emojiSprite('💎'), x - 18, y - 18, 36, 36); }
}
let dispScore = 0;

function drawFx(dt) {
  fx.setTransform(dpr, 0, 0, dpr, 0, 0); fx.clearRect(0, 0, W, H);
  for (const p of parts) { fx.save(); fx.globalAlpha = clamp(1 - p.t / p.max, 0, 1); fx.translate(p.x, p.y); fx.rotate(p.rot); fx.fillStyle = p.col; fx.fillRect(-p.sz / 2, -p.sz / 2, p.sz, p.sz); fx.restore(); }
  for (const c of confs) { fx.save(); fx.translate(c.x, c.y); fx.rotate(c.rot); fx.fillStyle = c.col; fx.scale(1, Math.cos(c.t * 8 + c.rot)); fx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); fx.restore(); }
  fx.textAlign = 'center'; fx.textBaseline = 'middle'; fx.lineJoin = 'round';
  for (const f of floats) { fx.globalAlpha = clamp(1.1 - f.t, 0, 1); fx.font = `900 ${f.size}px ui-rounded,sans-serif`; fx.lineWidth = 5; fx.strokeStyle = 'rgba(0,0,0,.55)'; fx.strokeText(f.text, f.x, f.y); fx.fillStyle = f.col; fx.fillText(f.text, f.x, f.y); }
  for (const b of banners) {
    const k = b.t / b.max, sc = k < .15 ? back(k / .15) : 1 + (k - .15) * .1, a = k > .75 ? (1 - k) * 4 : 1;
    fx.save(); fx.globalAlpha = clamp(a, 0, 1); fx.translate(W / 2, L.by + L.bs * .42); fx.rotate(Math.sin(b.t * 8) * .03); fx.scale(sc, sc);
    const sz = Math.min(W / 7.5, 64); fx.font = `900 ${sz}px ui-rounded,"Arial Rounded MT Bold",sans-serif`; fx.lineWidth = sz * .22; fx.strokeStyle = '#3a2418';
    fx.strokeText(b.text, 0, 0); const gr = fx.createLinearGradient(0, -sz / 2, 0, sz / 2); gr.addColorStop(0, '#fff6a8'); gr.addColorStop(1, b.col || '#ffb62e'); fx.fillStyle = gr; fx.fillText(b.text, 0, 0);
    if (b.sub) { fx.font = `900 ${sz * .5}px ui-rounded,sans-serif`; fx.lineWidth = sz * .12; fx.strokeText(b.sub, 0, sz * .75); fx.fillStyle = '#fff'; fx.fillText(b.sub, 0, sz * .75); }
    fx.restore();
  }
  fx.globalAlpha = 1;
}

/* ------------------------------------------------ menus */
const SCREENS = ['menu', 'levels', 'themes', 'pause', 'end'];
const hideAll = () => SCREENS.forEach(s => $('#' + s).classList.add('hide'));
function show(id) { hideAll(); $('#' + id).classList.remove('hide'); }
function toMenu() { state = 'menu'; $('#menu .sub').textContent = chal ? `🎯 Ein Freund fordert dich heraus: schlage ${chal} Punkte!` : 'Blöcke ziehen, Reihen räumen, Combos jagen!'; confs = []; $('#pauseBtn').classList.add('hide'); show('menu'); $('#bestN').textContent = save.best; $('#sndBtn').textContent = save.sound ? '🔊 Ton' : '🔇 Ton'; }
$$('[data-go]').forEach(b => b.onclick = () => { sfx.click(); toMenu(); });
$('#classicBtn').onclick = () => { sfx.click(); newGame('classic'); };
$('#advBtn').onclick = () => { sfx.click(); buildLevels(); show('levels'); };
$('#skinBtn').onclick = () => { sfx.click(); buildThemes(); show('themes'); };
$('#sndBtn').onclick = () => { save.sound = !save.sound; persist(); toMenu(); sfx.click(); };
$('#howBtn').onclick = () => alert('SO GEHT\'S\n\n• Zieh die Blöcke vom unteren Rand aufs 8×8-Brett.\n• Volle Reihen und Spalten verschwinden und geben Punkte.\n• Räumst du mehrere Zeilen auf einmal oder hintereinander, gibt es Combos.\n• Ein komplett leeres Brett bringt einen PERFEKT-Bonus!\n• Abenteuer: Sammle alle 💎, indem du die Reihen räumst, in denen sie liegen.\n• Blöcke drehen geht nicht – plane voraus!\n• Kein Platz mehr für die Blöcke = Spiel vorbei.');
function buildLevels() {
  const total = Math.max(30, save.unlocked + 10);
  $('#lvGrid').innerHTML = Array.from({ length: total }, (_, i) => { const n = i + 1, lock = n > save.unlocked, s = save.stars[n] || 0;
    return `<button class="lv ${lock ? 'lock' : ''} ${n === save.unlocked ? 'cur' : ''}" data-l="${n}">${lock ? '🔒' : n}<small>${lock ? '' : '★'.repeat(s) + '☆'.repeat(3 - s)}</small></button>`; }).join('');
  $$('.lv:not(.lock)').forEach(b => b.onclick = () => { sfx.click(); newGame('adv', +b.dataset.l); });
  const cur = $('.lv.cur'); if (cur) cur.scrollIntoView({ block: 'center' });
}
function buildThemes() {
  $('#thGrid').innerHTML = Object.entries(THEMES).map(([k, t]) => { const lock = save.best < t.need;
    return `<div class="th ${save.theme === k ? 'sel' : ''} ${lock ? 'lock' : ''}" data-k="${k}"><canvas width="200" height="100"></canvas>${t.name}<small>${lock ? '🔒 ab ' + t.need + ' Punkten (Rekord ' + save.best + ')' : save.theme === k ? '✓ Aktiv' : 'Tippen zum Wählen'}</small></div>`; }).join('');
  $$('.th').forEach(el => {
    const k = el.dataset.k, t = THEMES[k], g = el.querySelector('canvas').getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 100); gr.addColorStop(0, t.bg[0]); gr.addColorStop(1, t.bg[1]); g.fillStyle = gr; g.fillRect(0, 0, 200, 100);
    for (let i = 0; i < 6; i++) drawTile(g, 10 + i * 30, 35, 30, i, k);
    if (!el.classList.contains('lock')) el.onclick = () => { save.theme = k; persist(); sfx.click(); buildThemes(); };
  });
}
(function logo() { const l = $('#logo'), order = [0, 2, 5, 3, 7, 1, 6, 4, 0]; l.innerHTML = order.map((c, i) => `<i style="background:${PAL[c].m};animation-delay:${-i * .3}s"></i>`).join(''); })();

$('#pauseBtn').onclick = () => { if (state === 'play') { sfx.click(); state = 'paused'; $('#pause').classList.remove('hide'); } };
$('#resumeBtn').onclick = () => { sfx.click(); state = 'play'; $('#pause').classList.add('hide'); };
$('#restartBtn').onclick = () => { sfx.click(); newGame(mode, level); };
$('#quitBtn').onclick = () => { sfx.click(); toMenu(); };
addEventListener('keydown', e => { if ((e.key === 'Escape' || e.key === 'p') && state === 'play') $('#pauseBtn').click(); else if ((e.key === 'Escape') && state === 'paused') $('#resumeBtn').click(); });

layout(); pieces = []; toMenu(); requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
window.MB = { get state() { return state; }, get grid() { return grid; }, get pieces() { return pieces; }, newGame, tryPlace, get score() { return score; }, get L() { return L; }, SHAPES, solvable, occOf, gems: () => gems };
})();
