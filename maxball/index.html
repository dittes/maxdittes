<style>
:root{--ink:#2a1a14;--cream:#fff4dc;--butter:#ffd449;--leaf:#3dbb5b;--red:#ff5a4a;--orange:#ff8a1f;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --font:ui-rounded,"Arial Rounded MT Bold","Varela Round","Trebuchet MS",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2b1b4a;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#c,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:8}
.hide{display:none!important}
.st{pointer-events:auto;min-width:48px;min-height:48px;border:3px solid var(--ink);border-radius:18px;background:var(--cream);color:var(--ink);font:800 18px/1 var(--font);padding:0 16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;white-space:nowrap}
.st:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.st:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
.st.go{background:var(--leaf);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.st.warm{background:var(--butter)}
.st.org{background:var(--orange);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.st.big{min-height:62px;font-size:23px;padding:0 28px;border-radius:22px}
.st.sm{min-height:40px;font-size:14px;padding:0 10px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:6}
#hud .top{position:absolute;left:calc(var(--safe-l) + 10px);right:calc(var(--safe-r) + 10px);top:calc(var(--safe-t) + 10px);display:flex;gap:8px;align-items:flex-start}
.pill{background:rgba(255,244,220,.93);border:3px solid var(--ink);border-radius:16px;padding:5px 12px;box-shadow:0 4px 0 var(--ink);text-align:center;line-height:1.1}
.pill small{display:block;font-size:10px;font-weight:800;letter-spacing:1px;opacity:.7}
.pill b{font-size:24px;font-weight:900}
#hud .mid{flex:1;display:flex;justify-content:center;gap:8px}
#balls{display:flex;gap:3px;justify-content:center;font-size:17px;min-height:22px;flex-wrap:wrap;max-width:150px}
#balls i{font-style:normal;transition:transform .25s,opacity .25s}#balls i.used{opacity:.22;transform:scale(.7)}
#streak{position:absolute;left:50%;top:calc(var(--safe-t) + 82px);transform:translateX(-50%);font-weight:900;font-size:20px;color:#fff;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink);animation:pop .3s}
#obj{position:absolute;left:50%;bottom:calc(var(--safe-b) + 14px);transform:translateX(-50%);background:rgba(255,244,220,.93);border:3px solid var(--ink);border-radius:16px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
#wind{position:absolute;right:calc(var(--safe-r) + 10px);top:calc(var(--safe-t) + 84px);background:rgba(255,244,220,.93);border:3px solid var(--ink);border-radius:14px;padding:3px 10px;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--ink)}
#hint{position:absolute;left:50%;bottom:calc(var(--safe-b) + 70px);transform:translateX(-50%);text-align:center;font-weight:900;font-size:17px;color:#fff;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);width:min(90vw,380px);animation:bobh 1.4s ease-in-out infinite}
#hint .hand{font-size:44px;display:block;animation:pull 1.6s ease-in-out infinite}
@keyframes bobh{50%{transform:translateX(-50%) translateY(-6px)}}
@keyframes pull{0%,15%{transform:translateY(-16px)}60%,80%{transform:translateY(34px)}100%{transform:translateY(-16px)}}
@keyframes pop{0%{transform:translateX(-50%) scale(.3)}70%{transform:translateX(-50%) scale(1.2)}100%{transform:translateX(-50%) scale(1)}}
#pop{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.pp{position:absolute;left:50%;top:34%;transform:translate(-50%,0);font-weight:900;font-size:34px;color:#fff;text-shadow:0 4px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);animation:ppu 1.1s ease-out forwards;white-space:nowrap;text-align:center}
.pp small{display:block;font-size:20px;color:var(--butter)}
@keyframes ppu{0%{transform:translate(-50%,20px) scale(.3);opacity:0}15%{transform:translate(-50%,0) scale(1.25);opacity:1}30%{transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
/* top bar tools */
.tools{position:absolute;z-index:30;right:calc(var(--safe-r) + 10px);bottom:calc(var(--safe-b) + 10px);display:flex;gap:6px}
.back{position:absolute;z-index:30;left:calc(var(--safe-l) + 10px);top:calc(var(--safe-t) + 10px)}
.back a{pointer-events:auto}
/* screens */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 70px);overflow:hidden}
#title{background:radial-gradient(circle at 50% 20%,rgba(255,200,100,.25),rgba(30,15,70,.55) 70%)}
#title h1{font-size:min(19vw,96px);line-height:.88;text-align:center;color:#fff;letter-spacing:-1px;text-shadow:0 6px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);animation:bob 2.4s ease-in-out infinite}
#title h1 em{font-style:normal;color:var(--orange)}
.ballog{font-size:min(24vw,120px);animation:bounce 1.1s cubic-bezier(.3,0,.5,1) infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px) rotate(180deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}
.col{display:flex;flex-direction:column;gap:12px;width:min(82vw,320px)}
.row{display:flex;gap:10px}.row .st{flex:1}
.tag{color:#fff;font-weight:800;text-align:center;text-shadow:0 2px 0 var(--ink);font-size:15px;max-width:320px}
.card{width:min(100%,380px);background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:18px 18px 20px;text-align:center;box-shadow:0 7px 0 var(--ink);animation:up .5s cubic-bezier(.2,1.3,.4,1) both}
.card h3{font-size:28px;line-height:1}
.card .big-n{font-size:58px;font-weight:900;line-height:1.1;color:#e8531f;text-shadow:0 3px 0 rgba(58,36,24,.2)}
.card p{font-weight:700;margin:6px 0 12px;line-height:1.4}
.card .btns{display:flex;flex-direction:column;gap:10px}
.stars{font-size:46px;letter-spacing:4px;margin:4px 0;color:#d9c9a3}
.stars i{font-style:normal;display:inline-block}.stars i.on{color:#ffc61a;animation:starpop .5s cubic-bezier(.2,1.8,.4,1) both}
.stars i:nth-child(2){animation-delay:.25s}.stars i:nth-child(3){animation-delay:.5s}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
@keyframes up{from{transform:translateY(60px) scale(.8);opacity:0}}
#levels,#pause,#result,#intro{background:rgba(30,15,60,.72)}
#levels h2{color:#fff;font-size:30px;text-shadow:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,380px);overflow-y:auto;max-height:58vh;padding:4px;touch-action:pan-y}
.lv{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;background:var(--cream);font:900 22px/1 var(--font);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.lv small{font-size:11px;color:#e8a30c;letter-spacing:-1px;height:12px}
.lv.cur{background:var(--butter);animation:pulse 1s infinite}.lv.lock{background:#b8a8d6;color:#7a6a9a;cursor:default;box-shadow:0 2px 0 var(--ink);transform:translateY(2px)}
.lv.endless{grid-column:span 4;aspect-ratio:auto;height:54px;flex-direction:row;background:var(--orange);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
@keyframes pulse{50%{transform:scale(1.07)}}
#intro .card h3{font-size:24px}
.kick{font-size:13px;font-weight:900;letter-spacing:2px;color:#e8531f}
#pause h2{color:#fff;font-size:36px;text-shadow:0 4px 0 var(--ink);margin-bottom:6px}
#pause .st{width:min(70vw,280px)}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%);z-index:99;background:#2a1a14;color:#fff;font:700 15px var(--font);padding:12px 18px;border-radius:16px;box-shadow:0 4px 0 #000;transition:opacity .3s;max-width:88vw;text-align:center;opacity:0;pointer-events:none}
</style>

<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud" class="hide">

</div>

<script type="module">
import * as THREE from 'three';

/* =============================================================== helpers */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const KEY = 'maxball.v2';
const defSave = () => ({ unlocked: 1, stars: {}, best: {}, endless: 0, sfx: true, music: true, help: false });
let save = defSave(); try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(defSave(), s); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
let chal = 0; try { const q = +new URLSearchParams(location.search).get('c'); if (q > 0) chal = Math.min(q, 1e7) | 0; } catch (e) {}

/* =============================================================== levels */
const LEVELS = [
  { name: 'Warm-up',      target: 2, balls: 6, dist: 5.4 },
  { name: 'Freiwurf',     target: 3, balls: 7, dist: 6.2 },
  { name: 'Slide Show',   target: 3, balls: 7, dist: 6.4, motion: 'horizontal', speed: .7, range: 1.0 },
  { name: 'Weitwurf',     target: 3, balls: 7, dist: 7.6 },
  { name: 'Wippe',        target: 3, balls: 7, dist: 6.8, motion: 'vertical', speed: 1.0, range: .45 },
  { name: 'Brise',        target: 3, balls: 7, dist: 6.6, wind: 1.3 },
  { name: 'Acht',         target: 4, balls: 8, dist: 7.0, motion: 'figure8', speed: 1.0, range: 1.5 },
  { name: 'Enger Ring',   target: 4, balls: 8, dist: 6.8, rim: .84 },
  { name: 'Sturm',        target: 4, balls: 8, dist: 7.0, motion: 'horizontal', speed: .8, range: 1.2, wind: 2.2 },
  { name: 'Tiefenrausch', target: 4, balls: 8, dist: 7.4, motion: 'depth', speed: .9, range: 1.0 },
  { name: 'Profi',        target: 5, balls: 9, dist: 8.2, motion: 'horizontal', speed: 1.4, range: 1.9 },
  { name: 'MAX-Level',    target: 5, balls: 9, dist: 8.0, motion: 'random', speed: 1.1, range: 1.6, wind: 1.8, rim: .88 },
];

/* =============================================================== audio */
let AC = null, mGain = null, mTimer = 0, mNext = 0, mStep = 0, mBar = 0, noiseBuf = null, sfxOut = null;
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function prep() {
  const a = actx(); if (!a || noiseBuf) return; noiseBuf = a.createBuffer(1, a.sampleRate * 1.5, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const comp = a.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(a.destination);
  mGain = a.createGain(); mGain.gain.value = .5; mGain.connect(comp); sfxOut = a.createGain(); sfxOut.gain.value = 1; sfxOut.connect(comp);
}
function env(g, t, a, d, v) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, v), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function tone(f, d, type, v, f2, delay = 0, dest) { if (!save.sfx && !dest) return; const a = actx(); if (!a) return; prep(); const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d); env(g, t, .004, d, v); o.connect(g); g.connect(dest || sfxOut); o.start(t); o.stop(t + d + .05); }
function noise(d, v, type, f, f2, delay = 0, dest) { if (!save.sfx && !dest) return; const a = actx(); if (!a) return; prep(); const t = a.currentTime + delay, s = a.createBufferSource(); s.buffer = noiseBuf; const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d); const g = a.createGain(); env(g, t, .005, d, v); s.connect(fl); fl.connect(g); g.connect(dest || sfxOut); s.start(t, Math.random()); s.stop(t + d + .05); }
const sfx = {
  bounce(v) { const k = clamp(v / 8, .1, 1); tone(95 + k * 40, .13, 'sine', .35 * k, 45); noise(.06, .12 * k, 'lowpass', 600); },
  rim(v) { const k = clamp(v / 6, .25, 1); tone(780, .5, 'triangle', .22 * k, 760); tone(1190, .35, 'sine', .12 * k); tone(1710, .25, 'sine', .08 * k); noise(.05, .1 * k, 'highpass', 3000); },
  board(v) { const k = clamp(v / 6, .25, 1); tone(150, .16, 'sine', .4 * k, 80); noise(.07, .15 * k, 'bandpass', 900); },
  swish() { noise(.34, .3, 'bandpass', 3800, 1300); noise(.5, .12, 'highpass', 5000, 2500, .05); },
  net() { noise(.4, .12, 'bandpass', 2400, 900, .1); },
  shoot() { noise(.18, .1, 'highpass', 1800, 700); tone(300, .12, 'triangle', .06, 520); },
  cheer(d = 1.4, v = .4) { if (!save.sfx) return; const a = actx(); if (!a) return; prep(); const t = a.currentTime, s = a.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const fl = a.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.setValueAtTime(700, t); fl.frequency.linearRampToValueAtTime(1300, t + d * .5); fl.Q.value = .5; const g = a.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v * .5, t + .2); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(fl); fl.connect(g); g.connect(sfxOut); s.start(t, Math.random()); s.stop(t + d + .1); },
  buzzer() { tone(120, .8, 'sawtooth', .22); tone(123, .8, 'square', .12); },
  win() { [0, 4, 7, 12, 7, 12, 16].forEach((s, i) => tone(392 * Math.pow(2, s / 12), .2, 'square', .08, 0, i * .1)); },
  lose() { [7, 5, 2, 0].forEach((s, i) => tone(330 * Math.pow(2, s / 12), .25, 'triangle', .12, 0, i * .16)); },
  click() { tone(660, .05, 'square', .06); },
  pop() { tone(520, .12, 'triangle', .1, 880); },
};
/* chill street-ball groove: 94 BPM boom-bap with warm keys, walking bass and a little pentatonic tune */
const BPM = 94, S16 = 60 / BPM / 4, CH = [[293.66, 349.23, 440, 523.25], [196, 246.94, 293.66, 349.23], [261.63, 329.63, 392, 493.88], [220, 261.63, 329.63, 392]], ROOTS = [73.42, 49, 65.41, 55], PENT = [587.33, 659.25, 783.99, 880, 1046.5];
function mtone(f, t, d, type, v, f2) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(25, f2), t + d); env(g, t, .006, d, v); o.connect(g); g.connect(mGain); o.start(t); o.stop(t + d + .05); }
function mnoise(t, d, v, type, f) { const s = AC.createBufferSource(); s.buffer = noiseBuf; const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const g = AC.createGain(); env(g, t, .004, d, v); s.connect(fl); fl.connect(g); g.connect(mGain); s.start(t, Math.random()); s.stop(t + d + .05); }
function mstep(s, t) {
  const c = mBar % 4;
  if ([0, 6, 10].includes(s) || (c === 3 && s === 14)) { mtone(150, t, .2, 'sine', .6, 42); }
  if (s === 4 || s === 12) { mnoise(t, .17, .2, 'bandpass', 1800); mtone(190, t, .09, 'triangle', .1, 135); }
  if (s % 2 === 0) mnoise(t, .04, s % 4 === 0 ? .05 : .035, 'highpass', 8000); else if (Math.random() < .4) mnoise(t, .03, .018, 'highpass', 9000);
  if (s === 14 && mBar % 2) mnoise(t, .15, .035, 'highpass', 7000);
  if ([0, 3, 6, 10].includes(s)) { const f = ROOTS[c] * (s === 6 ? 2 : 1); mtone(f, t, s === 0 ? .5 : .2, 'sine', .34, f * .96); }
  if (s === 2 || s === 8 || s === 11) for (const f of CH[c]) { const o = AC.createOscillator(), g = AC.createGain(), fl = AC.createBiquadFilter(); o.type = 'triangle'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 1500; env(g, t, .01, s === 8 ? .5 : .22, .026); o.connect(fl); fl.connect(g); g.connect(mGain); o.start(t); o.stop(t + .8); }
  if ([1, 5, 9, 13, 15].includes(s) && Math.random() < .3) { const f = pick(PENT); mtone(f, t, .22, 'sine', .04); mtone(f, t + S16 * 3, .2, 'sine', .016); }
}
function mtick() { if (!AC) return; while (mNext < AC.currentTime + .15) { mstep(mStep, mNext + (mStep % 2 ? S16 * .2 : 0)); mNext += S16; mStep = (mStep + 1) % 16; if (!mStep) mBar++; } }
function musicStart() { if (!save.music || mTimer) return; const a = actx(); if (!a) return; prep(); mNext = a.currentTime + .1; mStep = 0; mBar = 0; mTimer = setInterval(mtick, 30); }
function musicStop() { clearInterval(mTimer); mTimer = 0; }
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* =============================================================== renderer & scene */
