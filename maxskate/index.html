function spawnDecor(dt) { moveWorld(speed * dt); }

function toMenu() {
  state = 'menu'; stopRoll(); resetWorld(); clearTraffic(); P.x = 0; speed = 0; hideScreens(); $('#menu').classList.remove('hide'); $('#pauseBtn').classList.add('hide'); $('#skip').classList.add('hide');
  $('#bestN').textContent = save.best; $('#coinN').textContent = save.coins; $('#sndBtn').textContent = save.sound ? '🔊 Ton' : '🔇 Ton'; $('#musBtn').textContent = save.music ? '🎵 Musik' : '🔇 Musik';
  $('#tagline').textContent = chal ? `🎯 Ein Freund fordert dich heraus: schlage ${chal} Punkte!` : 'Skate, spring, sammle Münzen!'; confs = [];
}
function hideScreens() { ['menu', 'tut', 'pause', 'end'].forEach(i => $('#' + i).classList.add('hide')); }
function startIntro() {
  actx(); resetWorld(); clearTraffic(); hideScreens(); musicStart(); state = 'intro'; T.intro = 0; speed = 0; $('#skip').classList.remove('hide'); $('#pauseBtn').classList.add('hide');
}
function skipIntro() { if (state === 'intro') endIntro(); }
function endIntro() { $('#skip').classList.add('hide'); if (!save.tutorial) { showTutorial(true); } else beginRun(); }
function beginRun() {
  musicStart(); hideScreens(); resetWorld(); state = 'play'; speed = 6; $('#pauseBtn').classList.remove('hide'); startRoll(); P.idleT = 2.5; coinPitch = 0;
  banner('LOS!', '🛹'); sfx.win && tone(660, .2, 'square', .06);
}
function gameOver() {
  state = 'over'; save.runs++; save.coins += coinsRun; persist(); $('#pauseBtn').classList.add('hide');
  const nb = score >= save.best && score > 0 && score > bestAtStart; const el = $('#end'); el.classList.remove('hide');
  el.innerHTML = `<div class="card"><h3>${chalDone ? '🎯 Freund geschlagen!' : 'Autsch! 💫'}</h3><div class="big-n">${score}</div><p>${nb ? '🏆 NEUER REKORD!' : 'Rekord: ' + save.best}<br>${Math.floor(dist)} m · 🪙 ${coinsRun} · ${tricksRun} Tricks</p>
  <div class="btns"><button class="st go big" id="eAgain">↻ Nochmal</button><button class="st warm" id="eShare">📣 Freunde herausfordern</button><button class="st" id="eMenu">🏠 Menü</button></div></div>`;
  $('#eAgain').onclick = () => { sfx.click(); beginRun(); }; $('#eMenu').onclick = () => { sfx.click(); toMenu(); }; $('#eShare').onclick = shareResult;
  if (nb) { confetti(120); sfx.win(); }
}
function pauseGame() { if (state !== 'play') return; state = 'paused'; musicDuck(true); setRoll(0, 300); $('#pause').classList.remove('hide'); }
function resumeGame() { if (state !== 'paused') return; state = 'play'; musicDuck(false); last = performance.now(); $('#pause').classList.add('hide'); }
$('#pauseBtn').onclick = () => { sfx.click(); pauseGame(); }; $('#resumeBtn').onclick = () => { sfx.click(); resumeGame(); };
$('#restartBtn').onclick = () => { sfx.click(); $('#pause').classList.add('hide'); beginRun(); }; $('#quitBtn').onclick = () => { sfx.click(); stopRoll(); toMenu(); };
$('#playBtn').onclick = () => { sfx.click(); startIntro(); };
$('#skip').onclick = () => { sfx.click(); skipIntro(); };
$('#helpBtn').onclick = () => { sfx.click(); showTutorial(false); };
$('#musBtn').onclick = () => { save.music = !save.music; persist(); if (save.music) musicStart(); else musicStop(); $('#musBtn').textContent = save.music ? '🎵 Musik' : '🔇 Musik'; sfx.click(); };
$('#sndBtn').onclick = () => { save.sound = !save.sound; persist(); $('#sndBtn').textContent = save.sound ? '🔊 Ton' : '🔇 Ton'; if (!save.sound) stopRoll(); sfx.click(); };

/* ------------------------------------------------ tutorial (controls intro) */
const SLIDES = [
  { c: 'd-lr', t: 'Spur wechseln', p: 'Wische nach links oder rechts, um die Spur zu wechseln. Weich Autos und Zügen aus!', e: '🧑<br>🛹' },
  { c: 'd-up', t: 'Ollie – Springen', p: 'Wische nach oben, um zu springen. Über Autos und Absperrungen kommst du so drüber – sogar oben drauf!', e: '🧑<br>🛹' },
  { c: 'd-dn', t: 'Ducken', p: 'Wische nach unten, um dich zu ducken und unter Schildern durchzurutschen. In der Luft fällst du schneller.', e: '🧑<br>🛹' },
  { c: 'd-tap', t: 'Tricks!', p: 'Tippe in der Luft für Kickflips, Spins und Grabs – Tricks geben Bonuspunkte. Spring auf Schienen für einen Grind!', e: '🧑<br>🛹' },
  { c: 'd-obs', t: 'Münzen sammeln', p: 'Sammle 🪙 Münzen, schnapp dir 🧲 Magnet & 2× Boost – und vermeide Züge, Autos und Absperrungen!', e: '🧑<br>🛹' },
];
let slide = 0, firstTut = false;
function showTutorial(first) {
  firstTut = first; slide = 0; hideScreens(); if (first) state = 'tutorial'; $('#tut').classList.remove('hide'); drawSlide();
}
function drawSlide() {
  const s = SLIDES[slide], last = slide === SLIDES.length - 1;
  $('#tut').innerHTML = `<div class="card"><h3>${s.t}</h3><div class="demo ${s.c}"><div class="lanes"></div><div class="dsk">${s.e}</div><div class="finger">👆</div></div><p>${s.p}</p>
  <div class="dots">${SLIDES.map((_, i) => `<i class="${i === slide ? 'on' : ''}"></i>`).join('')}</div>
  <div class="row">${slide ? '<button class="st" id="tPrev">◀</button>' : ''}<button class="st ${last ? 'go' : 'warm'}" id="tNext">${last ? (firstTut ? "Los geht's! 🛹" : 'Alles klar ✓') : 'Weiter ▶'}</button></div></div>`;
  $('#tNext').onclick = () => { sfx.click(); if (!last) { slide++; drawSlide(); } else { save.tutorial = true; persist(); if (firstTut) beginRun(); else { $('#tut').classList.add('hide'); $('#menu').classList.remove('hide'); } } };
  const pv = $('#tPrev'); if (pv) pv.onclick = () => { sfx.click(); slide--; drawSlide(); };
}

/* ------------------------------------------------ share */
function baseUrl() { try { const u = new URL(location.href); u.search = ''; u.hash = ''; return u.href; } catch (e) { return 'https://maxdittes.com/maxskate/'; } }
function shareCard() {
  const c = document.createElement('canvas'); c.width = 800; c.height = 480; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 480); gr.addColorStop(0, '#ff6a5a'); gr.addColorStop(1, '#ffc58a'); x.fillStyle = gr; x.fillRect(0, 0, 800, 480);
  x.fillStyle = '#3b3f57'; x.beginPath(); x.moveTo(250, 250); x.lineTo(550, 250); x.lineTo(800, 480); x.lineTo(0, 480); x.fill();
  x.strokeStyle = '#ffe9a8'; x.lineWidth = 6; x.setLineDash([26, 22]); x.beginPath(); x.moveTo(350, 250); x.lineTo(240, 480); x.moveTo(450, 250); x.lineTo(560, 480); x.stroke(); x.setLineDash([]);
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  const txt = (t, y, s, f, w = 12) => { x.font = `italic 900 ${s}px ui-rounded,"Arial Rounded MT Bold",sans-serif`; x.lineWidth = w; x.strokeStyle = '#2a1a14'; x.strokeText(t, 400, y); x.fillStyle = f; x.fillText(t, 400, y); };
  txt('MAX SKATE', 70, 76, '#ffd449'); txt(String(score), 190, 130, '#fff', 16); txt(score >= save.best && score > 0 ? '🏆 NEUER REKORD' : 'Rekord ' + save.best, 285, 40, '#ffd449', 8); txt('Schaffst du mehr?', 340, 34, '#fff', 8);
  x.font = '110px sans-serif'; x.fillText('🛹', 400, 425);
  return c;
}
let toastT = 0;
function toast(t) { let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;left:50%;bottom:calc(var(--safe-b) + 40px);transform:translateX(-50%);z-index:99;background:#2a1a14;color:#fff;font:700 15px var(--font);padding:12px 18px;border-radius:16px;box-shadow:0 4px 0 #000;transition:opacity .3s;max-width:88vw;text-align:center'; document.body.appendChild(el); } el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 2600); }
async function shareResult() {
  sfx.click(); const url = baseUrl() + '?c=' + score, text = `Ich habe ${score} Punkte bei Max Skate geschafft! 🛹 Kannst du mich schlagen?`, full = text + ' ' + url;
  try {
    if (navigator.share) {
      try { const blob = await new Promise(r => shareCard().toBlob(r, 'image/png')), file = new File([blob], 'max-skate.png', { type: 'image/png' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Max Skate', text: full }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      await navigator.share({ title: 'Max Skate', text, url }); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(full); toast('📋 Herausforderung kopiert – schick sie deinen Freunden!'); } catch (e) { prompt('Kopiere diesen Text und schick ihn deinen Freunden:', full); }
}

/* ------------------------------------------------ boot */
resetWorld(); updatePal(); toMenu(); requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
window.MS = { add: addObs, info: () => ({ calls: renderer.info.render.calls, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures, kids: world.children.length, tris: renderer.info.render.triangles }), get state() { return state; }, P, get obs() { return obs; }, get coins() { return coins; }, get score() { return score; }, get speed() { return speed; }, startIntro, beginRun, jump, duck, lane, tap, endIntro, skip: skipIntro, step: (n, dt = .016) => { for (let i = 0; i < n; i++) update(dt); }, showTutorial, crash };
</script>
